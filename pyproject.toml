[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepet"
version = "0.4.0"
description = "A desktop pet that grows when you code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodePet Contributors" }]

[project.urls]
Homepage = "https://github.com/Cyn30/codepet"
Repository = "https://github.com/Cyn30/codepet.git"
Issues = "https://github.com/Cyn30/codepet/issues"

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7", "keyring>=25,<26"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "Pillow>=11,<13", "numpy>=2,<3"]
packaging = ["PyInstaller>=6.11,<7"]

[project.scripts]
codepet = "codepet.cli:main"
codepet-desktop = "codepet.desktop:main"

[tool.setuptools.package-data]
codepet = ["assets/*.png", "assets/animations/*.json", "assets/animations/*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["outputs", "build", "dist", "website"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
